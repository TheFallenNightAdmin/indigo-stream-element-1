<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IndigoXEcho — Now Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B3FE4; --purple-lt:#A97BFF;
  --cyan:#00E5FF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:170px;overflow:hidden;background:transparent;
  font-family:'Chakra Petch',sans-serif;color:#fff}
.stage{position:relative;width:1920px;height:170px;display:flex;align-items:center}

.bar{position:relative;width:100%;height:132px;display:flex;align-items:center;
  background:linear-gradient(90deg, rgba(20,8,44,.96), rgba(8,4,18,.92));
  border-top:2px solid var(--purple);
  border-bottom:2px solid var(--purple);
  box-shadow:0 0 34px rgba(123,63,228,.5), inset 0 0 50px rgba(0,229,255,.06);
  animation:in .8s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.bar::before,.bar::after{content:"";position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 16px var(--cyan)}
.bar::before{top:-2px}
.bar::after{bottom:-2px}

/* left brand block */
.brand{position:relative;z-index:3;flex:0 0 auto;height:100%;display:flex;align-items:center;gap:20px;
  padding:0 42px 0 34px;
  background:linear-gradient(135deg, rgba(123,63,228,.34), rgba(8,4,18,.9));
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);
  border-right:2px solid var(--cyan);
  box-shadow:12px 0 34px rgba(0,229,255,.22)}
.brand img{width:96px;filter:drop-shadow(0 0 16px rgba(123,63,228,.95)) drop-shadow(0 0 30px rgba(0,229,255,.3));
  animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.brand .name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:34px;letter-spacing:7px;
  line-height:1;
  background:linear-gradient(180deg,#fff,var(--purple-lt) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(123,63,228,.8))}
.brand .live{display:flex;align-items:center;gap:9px;margin-top:8px;
  font-size:15px;letter-spacing:5px;text-transform:uppercase;color:var(--cyan)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}

/* marquee */
.track{position:relative;flex:1;height:100%;overflow:hidden;display:flex;align-items:center;
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.run{display:flex;flex:0 0 auto;align-items:center;white-space:nowrap;
  animation:marquee 26s linear infinite}
.track:hover .run{animation-play-state:running}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.item{display:flex;align-items:center;gap:22px;padding:0 34px;
  font-size:36px;letter-spacing:5px;text-transform:uppercase;font-weight:600}
.item .lbl{color:rgba(255,255,255,.52);font-size:26px;letter-spacing:7px}
.item .val{color:#fff;text-shadow:0 0 18px rgba(123,63,228,.9), 0 0 42px rgba(0,229,255,.35)}
.sep{color:var(--cyan);font-size:26px;filter:drop-shadow(0 0 12px var(--cyan))}

.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.22) 3px 4px);opacity:.45}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndigoXEcho — Intro Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B3FE4; --purple-lt:#A97BFF; --purple-deep:#2A0F52;
  --cyan:#00E5FF; --cyan-dim:#0097A8;
  --bg0:#07030F; --bg1:#12062B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg0);
  font-family:'Chakra Petch',sans-serif;color:#fff}
.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(123,63,228,.34), transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(0,229,255,.16), transparent 70%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 60%,var(--bg0));
}
/* moving grid floor */
.grid{position:absolute;inset:0;overflow:hidden;opacity:.5}
.grid::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-40%;height:110%;
  background-image:linear-gradient(rgba(0,229,255,.22) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(123,63,228,.20) 1px,transparent 1px);
  background-size:90px 90px;
  transform:perspective(600px) rotateX(70deg);
  animation:scroll 5s linear infinite;
  mask-image:linear-gradient(transparent,#000 55%);
  -webkit-mask-image:linear-gradient(transparent,#000 55%);
}
@keyframes scroll{to{background-position:0 90px}}
/* scanline + vignette */
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.30) 3px 4px);opacity:.5}
.vig{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 300px 90px rgba(0,0,0,.9)}

.wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2}
.mascot{width:290px;filter:drop-shadow(0 0 28px rgba(123,63,228,.95)) drop-shadow(0 0 60px rgba(0,229,255,.35));
  animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

.kicker{margin-top:26px;font-size:30px;letter-spacing:14px;font-weight:600;
  color:var(--cyan);text-transform:uppercase;text-shadow:0 0 18px rgba(0,229,255,.7)}

.count{font-family:'Orbitron',sans-serif;font-weight:900;font-size:230px;line-height:1;
  margin:6px 0 2px;letter-spacing:6px;
  background:linear-gradient(180deg,#fff 0%,var(--purple-lt) 38%,var(--purple) 62%,var(--cyan) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(123,63,228,.8)) drop-shadow(0 0 60px rgba(0,229,255,.35));}
.count.tick{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1.12)}100%{transform:scale(1)}}

.sub{font-size:24px;letter-spacing:10px;text-transform:uppercase;color:rgba(255,255,255,.55)}

.bar{margin-top:34px;width:760px;height:8px;background:rgba(255,255,255,.07);
  border:1px solid rgba(123,63,228,.55);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  box-shadow:0 0 22px rgba(0,229,255,.75);transition:width .95s linear}

.name{margin-top:40px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:34px;
  letter-spacing:14px;color:#fff;opacity:.9;
  text-shadow:0 0 16px rgba(123,63,228,.9), 0 0 40px rgba(0,229,255,.4)}

/* LIVE state */
.live{display:none;flex-direction:column;align-items:center}
.live.on{display:flex;animation:in .6s cubic-bezier(.2,.9,.3,1.3) both}
.wrap.off{display:none}
@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.live .big{font-family:'Orbitron',sans-serif;font-weight:900;font-size:170px;letter-spacing:16px;
  background:linear-gradient(180deg,#fff,var(--cyan) 55%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(0,229,255,.85));
  animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 60px rgba(123,63,228,.95))}}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>

  <div class="wrap" id="wrap">
    <img class="mascot" src="./mascot.png" alt="">
    <div class="kicker">Stream Starting In</div>
    <div class="count" id="count">10</div>
    <div class="sub">Get Ready</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="name">INDIGOXECHO</div>
  </div>

  <div class="live" id="live">
    <img class="mascot" src="./mascot.png" alt="">
    <div class="big">WE'RE LIVE</div>
    <div class="name">INDIGOXECHO</div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
</div>

<script>
/* Countdown length: change START, or pass ?t=300 in the browser-source URL (seconds). */
const START = parseInt(new URLSearchParams(location.search).get('t') || '10', 10);
let left = START;
const elCount = document.getElementById('count');
const elFill  = document.getElementById('fill');
const elWrap  = document.getElementById('wrap');
const elLive  = document.getElementById('live');

function fmt(s){
  if (s >= 60){
    const m = Math.floor(s/60), r = s%60;
    return m + ':' + String(r).padStart(2,'0');
  }
  return String(s);
}
function render(){
  elCount.textContent = fmt(left);
  elCount.classList.remove('tick'); void elCount.offsetWidth; elCount.classList.add('tick');
  elFill.style.width = (100 * (START - left) / START) + '%';
}
render();
const timer = setInterval(() => {
  left--;
  if (left <= 0){
    clearInterval(timer);
    elWrap.classList.add('off');
    elLive.classList.add('on');
    return;
  }
  render();
}, 1000);
</script>
</body>
</html>
